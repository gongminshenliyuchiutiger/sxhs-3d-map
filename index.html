<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新北市立雙溪高級中學立體互動校園全區導覽地圖</title>
  <link rel="stylesheet" href="style.css">
  <!-- FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google 字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <!-- Three.js 與 Tween.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>
  <!-- 3D 畫布容器 -->
  <div id="webgl-container"></div>

  <!-- 頂部標題列 -->
  <header class="app-header">
    <div class="header-left">
      <div class="logo-badge">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <div class="header-titles">
        <h1>新北市立雙溪高級中學立體互動校園全區導覽地圖</h1>
        <p class="subtitle">Shuang-Xi High School 3D Interactive Campus Navigation Map</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="btn-toggle-nav" class="action-btn secondary mobile-nav-btn" title="景點導覽清單" aria-label="景點導覽清單">
        <i class="fa-solid fa-bars-staggered"></i>
      </button>
      <button id="btn-search-room" class="action-btn secondary" title="搜尋教室與處室位置" aria-label="搜尋教室與處室位置">
        <i class="fa-solid fa-door-open"></i>
      </button>
      <button id="btn-indoor-xray" class="action-btn secondary" title="切換室內空間透視模式 (X-Ray)" aria-label="切換室內空間透視模式">
        <i class="fa-solid fa-cube"></i>
      </button>
      <button id="btn-call-dog" class="action-btn dog-call-btn" title="呼叫祥祥" aria-label="呼叫祥祥">
        <i class="fa-solid fa-paw"></i>
      </button>
      <button id="btn-tour" class="action-btn primary" title="自動巡覽" aria-label="自動巡覽">
        <i class="fa-solid fa-route"></i>
      </button>
      <button id="btn-reset-cam" class="action-btn secondary" title="重置視角" aria-label="重置視角">
        <i class="fa-solid fa-arrows-rotate"></i>
      </button>
      <button id="btn-top-view" class="action-btn secondary" title="俯視地圖" aria-label="俯視地圖">
        <i class="fa-solid fa-map"></i>
      </button>
      <button id="btn-toggle-labels" class="action-btn secondary active" title="地標標籤" aria-label="地標標籤">
        <i class="fa-solid fa-tag"></i>
      </button>
      <button id="btn-toggle-daynight" class="action-btn secondary night-mode-btn" title="切換白天與黑夜(夜燈)模式" aria-label="切換白天與黑夜模式">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>
  </header>

  <!-- 全校教室與處室智慧搜尋面板 -->
  <div class="room-search-modal" id="room-search-modal">
    <div class="room-search-box">
      <div class="search-header">
        <div class="search-title">
          <i class="fa-solid fa-magnifying-glass-location"></i>
          <span>搜尋全校教室與處室位置</span>
        </div>
        <button id="btn-close-search" class="search-close-btn" title="關閉搜尋">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="search-input-wrap">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="room-search-input" placeholder="輸入教室名稱、處室、科別（如：301、教務處、健康中心、化學、創客...）" autofocus>
        <button id="btn-clear-search" class="clear-btn" style="display:none;"><i class="fa-solid fa-circle-xmark"></i></button>
      </div>
      <div class="search-filter-pills" id="search-filter-pills">
        <button class="filter-pill active" data-type="all">全部</button>
        <button class="filter-pill" data-type="office">行政處室</button>
        <button class="filter-pill" data-type="classroom_shs">高中班級</button>
        <button class="filter-pill" data-type="classroom_jhs">國中班級</button>
        <button class="filter-pill" data-type="lab">實驗與專科</button>
        <button class="filter-pill" data-type="special">特色展演</button>
      </div>
      <div class="search-results-list" id="search-results-list">
        <!-- 搜尋結果項目由 JS 動態生成 -->
      </div>
    </div>
  </div>

  <!-- 左側快速建築導航清單（可拖曳移動、可縮小放大） -->
  <nav class="campus-nav" id="campus-nav">
    <div class="nav-title" id="nav-drag-handle" title="按住可拖曳移動此視窗">
      <div class="nav-title-text">
        <i class="fa-solid fa-compass"></i> 校園景點導覽
      </div>
      <div class="nav-controls">
        <button id="btn-minimize-nav" class="nav-ctrl-btn" title="縮小/放大視窗">
          <i class="fa-solid fa-minus"></i>
        </button>
      </div>
    </div>
    <div class="nav-list" id="building-nav-list">
      <!-- 由 JavaScript 動態生成導航項目 -->
    </div>
  </nav>

  <!-- 右側建築詳情側邊欄（點擊建築或地標時滑出） -->
  <aside class="detail-panel" id="detail-panel">
    <button class="close-btn" id="btn-close-detail" title="關閉詳情">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="panel-header">
      <div class="building-badge" id="building-icon-badge">
        <i class="fa-solid fa-building"></i>
      </div>
      <div>
        <h2 id="building-name">大智樓</h2>
        <span class="en-name" id="building-en-name">Da Zhi Building</span>
      </div>
    </div>

    <div class="panel-content">
      <div class="tags-row" id="building-tags">
        <!-- 標籤：例如無障礙電梯、坡道等 -->
      </div>

      <div class="section-box">
        <h3><i class="fa-solid fa-circle-info"></i> 建築概要</h3>
        <p id="building-desc">教學大樓，包含總務處、人事室、會計室及國中導師辦公室。</p>
      </div>

      <div class="section-box" id="floors-section">
        <div class="section-head-bar">
          <h3><i class="fa-solid fa-layer-group"></i> 樓層與室內空間配置</h3>
          <button id="btn-panel-xray" class="mini-tool-btn" title="切換此大樓室內透視視圖">
            <i class="fa-solid fa-cube"></i> <span>室內透視</span>
          </button>
        </div>
        
        <!-- 樓層切換 Tab 標籤列 -->
        <div class="floor-tabs" id="floor-tabs">
          <!-- 由 JS 動態生成各樓層切換按鈕 -->
        </div>

        <!-- 依平面圖繪製之 2D 樓層室內格局視覺化地圖 -->
        <div class="floor-layout-box" id="floor-layout-box">
          <div class="layout-title">
            <span id="current-floor-label">1F 室內空間格局圖</span>
            <span class="layout-note"><i class="fa-solid fa-arrows-left-right"></i> 點選教室可高亮定位</span>
          </div>
          <div class="floor-plan-grid" id="floor-plan-grid">
            <!-- 由 JS 動態繪製走廊與各教室空間 -->
          </div>
        </div>

        <!-- 樓層房間列表 -->
        <div class="floor-list" id="floor-list">
          <!-- 樓層列表 -->
        </div>
      </div>

      <div class="section-box" id="accessibility-section">
        <h3><i class="fa-solid fa-wheelchair"></i> 無障礙友善設施</h3>
        <ul class="access-list" id="access-list">
          <!-- 無障礙設施 -->
        </ul>
      </div>

      <div class="action-footer">
        <button id="btn-focus-cam" class="btn-block">
          <i class="fa-solid fa-crosshairs"></i> 特寫此建築
        </button>
      </div>
    </div>
  </aside>

  <!-- 左下角互動吉祥物 (可任意拖曳移動，懸停霓虹彩色發光抖動) -->
  <div id="mascot-widget" class="mascot-widget" title="我是雙溪吉祥物！拖曳我可以移動到任何地方喔！">
    <div class="mascot-body">
      <img src="image/LiyuChillGuy.svg" alt="Liyu Chill Guy 吉祥物" class="mascot-avatar" draggable="false">
    </div>
  </div>

  <!-- 底部操作提示與版權宣告（支援點擊縮小展開，避免遮擋視線） -->
  <footer class="app-footer">
    <div class="interaction-hint" id="interaction-hint">
      <div class="hint-mini-badge" id="hint-mini-badge">
        <i class="fa-solid fa-circle-question"></i> <span>操作說明</span>
      </div>
      <div class="hint-content" id="hint-content">
        <span><i class="fa-solid fa-computer-mouse"></i> 滑鼠左鍵：旋轉視角</span>
        <span><i class="fa-solid fa-up-down-left-right"></i> 滑鼠右鍵：平移鏡頭</span>
        <span><i class="fa-solid fa-arrows-up-down"></i> 滾輪：放大/縮小</span>
        <span><i class="fa-solid fa-hand-pointer"></i> 點擊建築物：查看詳細資訊與無障礙指引</span>
      </div>
      <button id="btn-toggle-hint" class="hint-toggle-btn" title="縮小/展開操作說明" aria-label="縮小/展開操作說明">
        <i class="fa-solid fa-chevron-down"></i>
      </button>
    </div>
    <div class="copyright-bar">
      <span>Copyright &copy; Liyuchiutiger Gongminshen</span>
    </div>
  </footer>

  <!-- 3D 世界懸浮標籤容器（由 JS 動態更新 2D 投影座標） -->
  <div id="labels-container"></div>

  <!-- 應用程式主邏輯 -->
  <script src="main.js"></script>
</body>
</html>
